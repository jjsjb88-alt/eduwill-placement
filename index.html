<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>편입 배치상담 · 비밀번호</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;color:#192741;background:#f3f5fa;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font-size:14px}.gate{width:100%;max-width:430px;background:#fff;border:1px solid #e3e8f1;border-radius:22px;padding:38px;box-shadow:0 16px 60px #2637590a}.brand{display:flex;align-items:center;gap:11px;margin-bottom:35px}.mark{background:#ffce32;width:38px;height:42px;display:grid;place-items:center;font-size:26px;font-weight:900;border-radius:11px;transform:rotate(-5deg)}.brand b{font-size:15px}.brand small{display:block;color:#65728a;font-size:11px;margin-top:3px}.eyebrow{font-size:10px;letter-spacing:1.3px;font-weight:700;color:#3651d6}h1{font-size:26px;line-height:1.45;margin:10px 0;letter-spacing:-.8px}.intro{color:#65728a;font-size:13px;line-height:1.8;margin:0 0 28px}label{font-size:12px;font-weight:600;display:block;margin-bottom:8px}.password-field{position:relative}input{width:100%;height:48px;border:1px solid #d7dfed;background:#fafbfe;border-radius:9px;padding:11px 64px 11px 13px;font:inherit;min-width:0}button{font:inherit;cursor:pointer;border-radius:9px}input:focus-visible,button:focus-visible{outline:3px solid #8196ff;outline-offset:3px}#togglePassword{position:absolute;right:9px;top:9px;border:0;background:transparent;font-size:11px;padding:6px;color:#65728a}#unlockButton{width:100%;background:#3651d6;border:0;color:#fff;padding:13px 14px;font-weight:700;margin-top:14px}#unlockButton:hover{background:#293fb5}#unlockButton:disabled{opacity:.6;cursor:wait}#gateStatus{font-size:12px;color:#65728a;line-height:1.7;min-height:22px;margin:13px 0 0;overflow-wrap:anywhere}#gateStatus.error{color:#ad3428}.footer{border-top:1px solid #edf0f6;margin-top:26px;padding-top:18px;font-size:10px;color:#8190a8}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:480px){body{padding:16px}.gate{padding:29px 24px;border-radius:18px}h1{font-size:24px}.brand{margin-bottom:28px}}
</style></head><body data-encrypted="app.enc.json"><main class="gate" id="passwordGate"><div class="brand"><span class="mark" aria-hidden="true">E</span><div><b>편입 배치상담</b><small>에듀윌 편입 부평학원</small></div></div><div class="eyebrow">COUNSELING REFERENCE</div><h1>상담자료 열기</h1><p class="intro">공용 비밀번호를 입력하면<br>상담 화면과 학교·학과 자료가 열립니다.</p><form id="passwordForm"><label for="sharedPassword">비밀번호</label><div class="password-field"><input id="sharedPassword" type="password" autocomplete="current-password" required aria-describedby="gateStatus" placeholder="공용 비밀번호 입력"><button id="togglePassword" type="button" aria-label="비밀번호 표시" aria-pressed="false">보기</button></div><button id="unlockButton" type="submit">상담자료 열기 →</button><p id="gateStatus" role="status" aria-live="polite"></p></form><div class="footer">부평학원 내부 상담용</div><noscript>자료를 열려면 브라우저에서 JavaScript를 사용해야 합니다.</noscript></main>

<script src="password-keyboard.js"></script><script src="password-gate.js?v=keyboard-v1"></script></body></html>
