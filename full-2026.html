<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>서정빈 · 전 분원 배치상담</title><link rel="stylesheet" href="report-view.css"><script src="report-view.js" defer></script></head>
<body><header><div class="bar"><strong>에듀윌 편입</strong><span>서정빈 배치상담실</span><button id="lock" hidden>상담 종료 · 잠그기</button></div></header>
<main>
<section id="gate" class="gate"><p class="eyebrow">2027학년도 편입</p><h1>전 분원 배치상담</h1><p class="lead">서정빈 <span>·</span> 모의고사 성적 상담</p>
<form id="login"><label for="password">상담용 암호</label><div class="inputRow"><input id="password" type="password" autocomplete="current-password" required autofocus><button id="showPw" type="button" class="quiet" aria-label="암호 표시" aria-pressed="false">보기</button></div><button type="submit" class="primary">상담실 열기</button></form><p id="loginStatus" class="status" role="status"></p><a href="mini.html">기출 배치상담 ↗</a></section>
<section id="app" hidden><div class="intro"><div><p class="eyebrow">2027학년도 편입 · 모의고사만</p><h1>학생별 배치상담</h1></div>
<form id="search"><label for="name">학생 이름</label><div class="inputRow"><input id="name" autocomplete="off" placeholder="학생 이름 전체" maxlength="80" required><button class="primary">조회</button></div></form></div>
<p id="status" role="status"></p><div id="choices"></div>
<section id="report" hidden><div class="profile"><div><span id="branch"></span><h2 id="student"></h2></div><div class="metrics"><div>영어 백분위 <b id="english"></b></div><div>수학 백분위 <b id="math"></b></div></div></div>
<div class="filters"><label>계열 <select id="field"><option>전체</option><option>인문</option><option>자연</option></select></label><label>전형 <select id="track"><option value="전체">전체</option><option value="일반">일반편입</option><option value="학사">학사편입</option></select></label></div>
<div class="board"><section><div class="sectionHead"><h2>학교</h2><span id="count"></span></div><nav id="bands" aria-label="학교 판정"></nav><div id="schools"></div></section>
<section><div class="sectionHead"><h2 id="school">학과별 결과</h2><span id="schoolBand"></span></div><label class="deptSearch">학과 찾기 <input id="department" type="search" autocomplete="off"></label><div id="rows"></div></section></div>
<details id="history"><summary>응시 성적 보기</summary><div class="scroll"><table><thead><tr><th>시행일</th><th>시험</th><th>과목</th><th>원점수</th><th>백분위</th><th>응시자</th><th>반영</th></tr></thead><tbody id="exams"></tbody></table></div></details></section>
<footer>서정빈 배치상담실 <a href="mini.html">기출 배치상담 ↗</a></footer></section></main></body></html>
